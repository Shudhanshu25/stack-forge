# Merge to main: run CI, build and push images tagged with the commit SHA, deploy to the server,
# smoke-test /api/v1/health/services through the proxy, and roll back if it fails.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# Optional secret: VITE_SENTRY_DSN (baked into the frontend build)
# Variable:  DEPLOY_PATH (directory on the server holding infrastructure/.env.prod)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: frontend
            dockerfile: frontend/Dockerfile
            target: ''
          - image: api
            dockerfile: backend/Dockerfile
            target: api
          - image: worker
            dockerfile: backend/Dockerfile
            target: worker
          - image: simulation
            dockerfile: simulation/Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry paths must be lowercase)
        id: name
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stackforge" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.name.outputs.prefix }}-${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Job conditions cannot read secrets, so this job reports whether a server is configured.
  # Until DEPLOY_HOST is set, the deploy job is skipped (not failed); builds and tests still run.
  deploy-target:
    name: Deploy target configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::No DEPLOY_HOST secret yet; see docs/deployment.md to set up a server."
          fi

  deploy:
    name: Deploy, smoke test, roll back on failure
    needs: [images, deploy-target]
    if: needs.deploy-target.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy the deployment files (compose, proxy, monitoring, backup and deploy scripts)
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          tar -czf infrastructure.tgz --exclude='.env.prod' --exclude='backups' infrastructure
          scp -i ~/.ssh/deploy_key infrastructure.tgz "$TARGET:$DEPLOY_PATH/infrastructure.tgz"
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "cd '$DEPLOY_PATH' && tar -xzf infrastructure.tgz && rm infrastructure.tgz"
      - name: Deploy ${{ github.sha }}
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stackforge"
          # The job token logs the server in to the registry for this pull only.
          ssh -i ~/.ssh/deploy_key "$TARGET" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && cd '$DEPLOY_PATH' \
             && IMAGE_PREFIX='$prefix' bash infrastructure/deploy/deploy.sh '${{ github.sha }}'; \
             status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
