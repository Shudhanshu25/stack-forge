# Development: the services run on the host (npm / uvicorn); Prometheus runs in Docker.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ['host.docker.internal:4000'] }]
  - job_name: worker
    static_configs: [{ targets: ['host.docker.internal:9464'] }]
  - job_name: simulation
    static_configs: [{ targets: ['host.docker.internal:8000'] }]
